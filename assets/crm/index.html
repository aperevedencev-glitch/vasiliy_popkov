<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CRM · Василий Попков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=PT+Mono&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{
  --bg:#ECEDE6;--paper:#F7F7F2;--ink:#1C2430;--muted:#5A6270;--rule:#C9CBC0;--stamp:#5B4A8B;--brass:#8C6D24;
  --ok:#2E7D4F;--warn:#9A6A00;--bad:#B3261E;
  --display:"Prata",Georgia,serif;--ui:"PT Sans",system-ui,sans-serif;--mono:"PT Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--paper:#1B212C;--ink:#E4E3DA;--muted:#9CA3AF;--rule:#2E3644;--stamp:#A898DA;--brass:#D2B266;--ok:#6CC08F;--warn:#E3B45A;--bad:#F08A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui)}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding-block:16px;border-bottom:1px solid var(--rule);margin-bottom:22px}
header h1{font:400 22px var(--display);margin:0}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button,.btn,.chip{font:13px var(--mono);border:1px solid var(--rule);background:transparent;color:var(--ink);padding:7px 11px;border-radius:2px;cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.badge{display:inline-block;font:11.5px var(--mono);padding:1px 7px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.s-new{color:var(--stamp)}.s-waiting{color:var(--warn)}.s-paid{color:var(--brass)}.s-sent{color:var(--ok)}.s-cancelled{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--rule);padding:14px 16px}
.kpi b{display:block;font:400 30px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font:12px var(--mono);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-bottom:18px}
.panel{background:var(--paper);border:1px solid var(--rule);padding:16px;min-width:0}
.panel h2{font:400 19px var(--display);margin:0 0 10px}
.panel .sub{font:12px var(--mono);color:var(--muted);margin:-6px 0 10px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--mono)}
.chart .bar{fill:var(--ink)}
.chart .bar:hover{fill:var(--stamp)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.hbar{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.hbar i{display:block;height:12px;background:var(--ink);border-radius:0 3px 3px 0;min-width:2px}
.hbar em{font:12px var(--mono);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:12px var(--mono);color:var(--muted);font-weight:400;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools .grow{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:2px;padding:7px 9px}
textarea{width:100%;min-height:90px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:3px;font-size:14px;max-width:calc(100vw - 32px)}
.login{max-width:360px;margin:16vh auto;background:var(--paper);border:1px solid var(--rule);padding:24px}
.login h1{font:400 26px var(--display);margin:0 0 14px}
.login input{width:100%;margin-bottom:12px}
.warnbox{border:1px solid var(--warn);color:var(--ink);padding:10px 14px;margin-bottom:16px;background:var(--paper)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.form label{display:flex;flex-direction:column;gap:3px;font:12px var(--mono);color:var(--muted)}
.linkbox{font:12px var(--mono);word-break:break-all;background:var(--bg);padding:6px 8px;border:1px dashed var(--rule);margin-top:6px}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.bk{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;border-bottom:1px solid var(--rule)}
.bk:last-child{border-bottom:0}
.bk img{width:64px;height:96px;object-fit:cover;background:var(--rule);display:block}
.bk h3{font:400 17px var(--display);margin:0 0 2px}
.fmtl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fmtl .badge{font-size:12px}
.k-ebook{color:var(--stamp)}.k-print{color:var(--brass)}.k-audio{color:var(--ok)}
.editor{background:var(--paper);border:1px solid var(--ink);padding:16px;margin:0 0 16px}
.editor h2{font:400 19px var(--display);margin:0 0 10px}
.fbox{border:1px dashed var(--rule);padding:12px;margin:10px 0}
.up{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:12px var(--mono)}
.up progress{width:140px}
.check{flex-direction:row!important;align-items:center;gap:6px!important}
.check input{width:auto}
.wide2{grid-column:1/-1}
audio{max-width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub=n=>(Number(n)||0).toLocaleString('ru-RU')+' ₽';
const dt=s=>s?new Date(s.replace(' ','T')+(s.includes('T')?'':'Z')).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const STATUS={new:'Новая',waiting:'Ждёт оплаты',paid:'Оплачена',sent:'Книга отправлена',cancelled:'Отменена'};
const STAGE={contact:'Первый контакт',talks:'Переговоры',agreed:'Договорились',active:'Работаем',paused:'Пауза'};
const KIND={'издательство':1,'библиотека':1,'конкурс':1,'магазин':1,'СМИ':1,'другое':1};
async function api(path,data,method){const r=await fetch('/api/crm/'+path,{method:method||(data?'POST':'GET'),headers:{'content-type':'application/json'},body:data?JSON.stringify(data):undefined,credentials:'same-origin'});
  if(r.status===401){login();throw new Error('Нужно войти')}const j=await r.json().catch(()=>({ok:false,error:'Ошибка сервера'}));if(j.ok===false)throw new Error(j.error||'Ошибка');return j}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Ссылка скопирована')}catch(e){prompt?.('Скопируйте ссылку',t)}}

function login(){
  $('#app').innerHTML=`<form class="login" id="lf"><h1>CRM автора</h1><label class="small muted" for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password" required><button class="btn primary" type="submit">Войти</button><p class="small" id="lerr" style="color:var(--bad)"></p></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:$('#pw').value});start()}catch(err){$('#lerr').textContent=err.message}};
}

const TABS=[['overview','Обзор'],['orders','Заявки'],['leads','Обращения'],['subs','Подписчики'],['partners','Партнёры'],['books','Каталог'],['excerpts','Отрывки'],['songs','Песни']];
const FK={ebook:'Электронная',print:'Печатная',audio:'Аудиокнига'};
const BK={roman:'Роман',stories:'Рассказы и повести',poetry:'Поэзия'};
// загрузка файла в хранилище R2 с индикатором
function uploadFile(file,prefix,bar){return new Promise((res,rej)=>{const x=new XMLHttpRequest();
  x.open('PUT','/api/crm/upload?prefix='+prefix+'&name='+encodeURIComponent(file.name));x.setRequestHeader('content-type',file.type||'application/octet-stream');
  if(bar){bar.hidden=false;x.upload.onprogress=e=>{if(e.lengthComputable)bar.value=e.loaded/e.total}}
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}if(x.status===401){login();return rej(new Error('Нужно войти'))}j.ok?res(j):rej(new Error(j.error||'Не удалось загрузить'))};
  x.onerror=()=>rej(new Error('Нет связи с сервером'));x.send(file)})}
// поле «файл»: показать текущий, загрузить новый
function fileField(id,label,key,name,prefix,accept,r2){
  return `<div class="up wide2" data-up="${id}" data-prefix="${prefix}"><span>${label}:</span><span class="cur">${key?esc(name||key):'<span class="muted">нет</span>'}</span>
  <input type="hidden" data-key value="${esc(key||'')}"><input type="hidden" data-name value="${esc(name||'')}"><input type="hidden" data-size value="">
  ${r2?`<input type="file" accept="${accept}"><progress hidden max="1" value="0"></progress>`:'<span class="muted">загрузка файлов — после включения R2</span>'}${key?'<button type="button" class="btn small" data-clear>Убрать</button>':''}</div>`}
function bindUploads(root){root.querySelectorAll('[data-up]').forEach(box=>{
  const inp=box.querySelector('input[type=file]');if(inp)inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const r=await uploadFile(f,box.dataset.prefix,box.querySelector('progress'));box.querySelector('[data-key]').value=r.key;box.querySelector('[data-name]').value=f.name;box.querySelector('[data-size]').value=r.size;box.querySelector('.cur').textContent=f.name+' — загружено';toast('Файл загружен, не забудьте сохранить')}catch(e){toast(e.message)}};
  const c=box.querySelector('[data-clear]');if(c)c.onclick=()=>{box.querySelector('[data-key]').value='';box.querySelector('[data-name]').value='';box.querySelector('.cur').innerHTML='<span class="muted">будет убран при сохранении</span>'}})}
const upVal=(root,id,f)=>root.querySelector(`[data-up="${id}"] [data-${f}]`)?.value||'';
let tab=(location.hash||'#overview').slice(1);
function start(){
  $('#app').innerHTML=`<div class="wrap"><header><h1>CRM · Василий Попков</h1><nav>${TABS.map(([k,t])=>`<button type="button" data-tab="${k}">${t}</button>`).join('')}<button type="button" id="out">Выйти</button></nav></header><main id="view"></main></div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.tab});
  $('#out').onclick=async()=>{await api('logout',{});login()};
  window.onhashchange=()=>{tab=(location.hash||'#overview').slice(1);render()};
  render();
}
function render(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'true':'false'));
  ({overview,orders,leads,subs,partners,books,excerpts,songs}[tab]||overview)().catch(e=>$('#view').innerHTML=`<p>${esc(e.message)}</p>`);
}

// ---------- Обзор
function barChart(days,vals,label){
  const W=640,H=180,P={l:34,r:8,t:10,b:22},w=W-P.l-P.r,h=H-P.t-P.b;
  const max=Math.max(1,...vals),nice=max<=5?5:Math.ceil(max/5)*5,step=w/vals.length,bw=Math.max(2,step-2);
  const ticks=[0,nice/2,nice];let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  ticks.forEach(t=>{const y=P.t+h-h*t/nice;s+=`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/><text x="${P.l-6}" y="${y+4}" text-anchor="end">${t}</text>`});
  vals.forEach((v,i)=>{const bh=h*v/nice,x=P.l+i*step+1,y=P.t+h-bh;s+=`<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,v?2:0)}" rx="${Math.min(4,bw/2)}"><title>${days[i].slice(8,10)}.${days[i].slice(5,7)}: ${v}</title></rect>`});
  const lab=[0,Math.floor(vals.length/2),vals.length-1];lab.forEach(i=>{s+=`<text x="${P.l+i*step+step/2}" y="${H-6}" text-anchor="middle">${days[i].slice(8,10)}.${days[i].slice(5,7)}</text>`});
  return s+'</svg>';
}
function hbars(rows,key='target'){const max=Math.max(1,...rows.map(r=>r.n));return rows.length?rows.map(r=>`<div class="hbar"><span>${esc(r[key]||'—')}</span><i style="width:${(r.n/max*100).toFixed(1)}%"></i><em>${r.n}</em></div>`).join(''):'<p class="muted small">Пока нет данных</p>'}
async function overview(){
  const days=Number(sessionStorage.getItem('days')||30);
  const d=await api('summary?days='+days);
  const list=[];for(let i=days-1;i>=0;i--)list.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));
  const by=t=>list.map(x=>(d.series.find(r=>r.day===x&&r.type===t)||{n:0}).n);
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const views=by('view'),orders=by('order'),subs=by('subscribe');
  const rev=d.sales.reduce((a,b)=>a+(b.revenue||0),0),sold=d.sales.reduce((a,b)=>a+(b.sold||0),0),ord=sum(orders);
  const conv=sum(views)?(ord/sum(views)*100).toFixed(1)+' %':'—';
  $('#view').innerHTML=`
  ${d.botLinked?'':'<div class="warnbox">Уведомления в Telegram ещё не подключены: напишите боту <b>/admin пароль-от-CRM</b>.</div>'}
  ${d.r2?'':'<div class="warnbox">Хранилище файлов R2 не включено: нельзя загрузить книги, аудио и песни, покупатели не получат ссылки на скачивание. Включите R2 в Cloudflare (бесплатный тариф) и запустите «Развернуть сайт.bat».</div>'}
  <div class="tools"><span class="muted small">Период:</span>${[7,30,90,365].map(n=>`<button class="chip btn" data-days="${n}" ${n===days?'style="background:var(--ink);color:var(--paper)"':''}>${n===365?'год':n+' дн.'}</button>`).join('')}</div>
  <div class="kpis">
    <div class="kpi"><b>${sum(views).toLocaleString('ru-RU')}</b><span>просмотров сайта</span></div>
    <div class="kpi"><b>${ord}</b><span>заявок на книги · конверсия ${conv}</span></div>
    <div class="kpi"><b>${rub(rev)}</b><span>выручка · продано ${sold}</span></div>
    <div class="kpi"><b>${d.counts.open_orders}</b><span>заявок ждут действия</span></div>
    <div class="kpi"><b>${d.counts.subscribers}</b><span>подписчиков · +${sum(subs)} за период</span></div>
    <div class="kpi"><b>${d.counts.new_leads}</b><span>новых обращений</span></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Просмотры сайта</h2><p class="sub">по дням</p>${barChart(list,views,'Просмотры по дням')}</div>
    <div class="panel"><h2>Заявки на книги</h2><p class="sub">по дням, сайт и бот</p>${barChart(list,orders,'Заявки по дням')}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Переходы в магазины</h2>${hbars(d.shops)}</div>
    <div class="panel"><h2>Интерес к книгам</h2><p class="sub">переходы на Jaaj.Club</p>${hbars(d.books.map(r=>({...r,target:bookName(r.target)})))}</div>
  </div>
  <div class="panel"><h2>Продажи по книгам</h2><div class="tablewrap" style="border:0"><table><thead><tr><th>Книга</th><th class="num">Заявок</th><th class="num">Продано</th><th class="num">Выручка</th></tr></thead><tbody>
  ${d.sales.filter(s=>s.orders).map(s=>`<tr><td>${esc(s.title)}</td><td class="num">${s.orders||0}</td><td class="num">${s.sold||0}</td><td class="num">${rub(s.revenue)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Заявок за период нет</td></tr>'}</tbody></table></div></div>
  <div class="grid2" style="margin-top:18px">
    <div class="panel"><h2>Заявки по видам изданий</h2>${hbars((d.formatsSold||[]).map(r=>({target:FK[r.kind]||'Электронная',n:r.orders})))}</div>
    <div class="panel"><h2>Песни</h2><p class="sub">прослушивания и скачивания, всего</p>${hbars((d.songs||[]).map(r=>({target:r.title+' · ▶ '+r.plays,n:r.downloads})))}</div>
  </div>`;
  document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{sessionStorage.setItem('days',b.dataset.days);render()});
}
const JAAJ={445:'Петля Козырева',435:'Инкогнито',459:'Люди из леса',458:'Конец белого лотоса',457:'Общество посвящённых',455:'Душа нараспашку',442:'Протокол «Мёртвая петля»',441:'Сезон дождей для двоих',439:'Зимовка бабочек',438:'Чемодан без ручки',434:'Свет, который считали вечным',432:'Золото империи',431:'Морская звезда',427:'Исповедь',426:'Тайна янтарной комнаты',424:'Эра равновесия',421:'Сертификат гениальности',420:'Крушение империи',418:'Тайна Либереи',417:'Источник жизни',416:'Тридцать шестая буква',415:'Хранитель тени',414:'Кристалл счастья',413:'Чудь белоглазая',zoloto:'Золото империи (EPUB)',libereya:'Либерея (EPUB)',morskaya:'Морская звезда (EPUB)',inkognito:'Инкогнито (EPUB)',kristall:'Кристалл счастья (EPUB)',sertifikat:'Сертификат гениальности (EPUB)',ispoved:'Исповедь (EPUB)'};
const bookName=t=>JAAJ[t]||t;

// ---------- Заявки
let ordFilter='open';
async function orders(){
  const {items}=await api('orders');const cat=await api('books');const bt=Object.fromEntries(cat.items.map(b=>[b.id,b.title]));
  const fl=cat.formats.filter(f=>f.active&&f.price>0);
  const show=items.filter(o=>ordFilter==='all'||(ordFilter==='open'?['new','waiting','paid'].includes(o.status):o.status===ordFilter));
  $('#view').innerHTML=`<div class="tools">${[['open','В работе'],['new','Новые'],['waiting','Ждут оплаты'],['sent','Отправлены'],['cancelled','Отменены'],['all','Все']].map(([k,t])=>`<button class="btn chip" data-f="${k}" ${k===ordFilter?'style="background:var(--ink);color:var(--paper)"':''}>${t} (${k==='all'?items.length:items.filter(o=>k==='open'?['new','waiting','paid'].includes(o.status):o.status===k).length})</button>`).join('')}<span class="grow"></span><a class="btn" href="/api/crm/export?t=orders">CSV</a><button class="btn" id="addOrd">Добавить заявку</button></div>
  <div id="newOrd" hidden class="panel" style="margin-bottom:12px"><div class="form"><label>Книга<select id="no-book">${fl.map(f=>`<option value="${f.id}" data-kind="${f.kind}">${esc(bt[f.book_id]||f.book_id)} · ${FK[f.kind]}${f.label?' · '+esc(f.label):''} — ${rub(f.price)}</option>`).join('')}</select></label><label>Имя<input id="no-name"></label><label>E-mail<input id="no-email"></label><label>Telegram<input id="no-tg" placeholder="@username"></label><label>Телефон (для печатной)<input id="no-phone"></label><label class="wide2">Адрес доставки (для печатной)<input id="no-addr"></label></div><button class="btn primary" id="no-save">Создать</button></div>
  <div class="tablewrap"><table><thead><tr><th>№</th><th>Дата</th><th>Книга</th><th>Покупатель</th><th>Статус</th><th>Действия</th></tr></thead><tbody>
  ${show.map(o=>`<tr data-id="${o.id}"><td>${o.id}</td><td class="small">${dt(o.created)}<br><span class="muted">${o.source==='bot'?'бот':o.source==='crm'?'CRM':'сайт'}</span></td><td>${esc(o.title)}<br><span class="badge k-${o.format_kind||'ebook'}">${FK[o.format_kind||'ebook']}${o.format_label?' · '+esc(o.format_label):''}</span> <span class="muted small">${rub(o.price)}</span>${o.address?`<div class="small">📦 ${esc(o.address)}</div>`:''}</td>

  const e=edit||{published:1,sort:0};
  $('#view').innerHTML=`<div class="editor"><h2>${e.id?'Изменить отрывок':'Новый отрывок'}</h2><div class="form">
  <label class="wide2">Заголовок<input id="x-title" value="${esc(e.title||'')}" placeholder="Глава 1. Литерный эшелон"></label>
  <label>Книга<select id="x-book"><option value="">— без книги —</option>${cat.items.map(b=>`<option value="${esc(b.id)}" ${b.id===e.book_id?'selected':''}>${esc(b.title)}</option>`).join('')}</select></label>
  <label>Порядок<input id="x-sort" type="number" value="${e.sort??0}"></label>
  <label class="wide2">Текст — абзацы через пустую строку<textarea id="x-body" style="min-height:260px">${esc(e.body||'')}</textarea></label>
  <label class="check"><input type="checkbox" id="x-pub" ${e.published?'checked':''}> Опубликован на сайте</label></div>
  <div class="actions"><button class="btn primary" id="x-save">Сохранить</button>${e.id?'<button class="btn" id="x-new">Новый</button><button class="btn" id="x-del">Удалить</button>':''}</div></div>
  <div class="tablewrap"><table><thead><tr><th>Отрывок</th><th>Книга</th><th>Знаков</th><th>На сайте</th><th></th></tr></thead><tbody>
  ${items.map(x=>`<tr><td>${esc(x.title)}<div class="small muted">${esc(x.body.slice(0,140))}…</div></td><td>${esc(bt[x.book_id]||'—')}</td><td class="num">${x.body.length.toLocaleString('ru-RU')}</td><td>${x.published?'да':'<span class="muted">нет</span>'}</td><td><button class="btn small" data-xe="${x.id}">Изменить</button> <a class="btn small" href="/#excerpt-${x.id}" target="_blank">Открыть</a></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Отрывков пока нет. Они появятся на сайте разделом «Отрывки» и кнопкой у книги.</td></tr>'}</tbody></table></div>`;
  $('#x-save').onclick=async()=>{try{await api('excerpts',{id:e.id,title:$('#x-title').value,book_id:$('#x-book').value,sort:$('#x-sort').value,body:$('#x-body').value,published:$('#x-pub').checked});toast('Отрывок сохранён');excerpts()}catch(err){toast(err.message)}};
  if(e.id){$('#x-new').onclick=()=>excerpts();$('#x-del').onclick=async()=>{if(!confirm('Удалить отрывок?'))return;await api('excerpt-delete',{id:e.id});toast('Удалено');excerpts()}}
  document.querySelectorAll('[data-xe]').forEach(b=>b.onclick=()=>excerpts(items.find(x=>x.id===Number(b.dataset.xe))));
}

// ---------- Песни
let POEMS=null;
async function songs(edit){
  const d=await api('songs');if(!POEMS)POEMS=(await api('poems')).items;
  const e=edit||{published:1,sort:0};
  $('#view').innerHTML=`${d.r2?'':'<div class="warnbox">R2 не включено — загрузить аудиофайл пока нельзя. Можно указать ссылку на песню во внешнем сервисе (Яндекс Музыка, VK, YouTube, облако).</div>'}
  <div class="editor"><h2>${e.id?'Изменить песню':'Новая песня'}</h2><div class="form">
  <label>Название песни<input id="s-title" value="${esc(e.title||'')}"></label>
  <label>На стихи<input id="s-poem" list="poemList" value="${esc(e.poem||'')}" placeholder="начните вводить название"><datalist id="poemList">${POEMS.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></label>
  <label>Исполнитель<input id="s-perf" value="${esc(e.performer||'')}"></label>
  <label>Музыка<input id="s-music" value="${esc(e.music_by||'')}"></label>
  ${fileField('song','Аудиофайл (MP3, M4A, OGG — до 95 МБ)',e.file_key,e.file_name,'songs','audio/*',d.r2)}
  <label class="wide2">Или ссылка на песню во внешнем сервисе<input id="s-ext" value="${esc(e.ext_url||'')}" placeholder="https://…"></label>
  <label class="wide2">Короткое описание<input id="s-note" value="${esc(e.note||'')}"></label>
  <label class="wide2">Текст песни<textarea id="s-lyr" style="min-height:180px">${esc(e.lyrics||'')}</textarea></label>
  <label>Порядок<input id="s-sort" type="number" value="${e.sort??0}"></label>
  <label class="check"><input type="checkbox" id="s-pub" ${e.published?'checked':''}> Опубликована на сайте</label></div>
  <div class="actions"><button class="btn primary" id="s-save">Сохранить</button>${e.id?'<button class="btn" id="s-new">Новая</button><button class="btn" id="s-del">Удалить</button>':''}<a class="btn" href="/api/crm/export?t=songs">CSV</a></div></div>
  <div class="tablewrap"><table><thead><tr><th>Песня</th><th>Аудио</th><th class="num">Прослушиваний</th><th class="num">Скачиваний</th><th>На сайте</th><th></th></tr></thead><tbody>
  ${d.items.map(x=>`<tr><td>${esc(x.title)}${x.poem?`<div class="small muted">на стихи «${esc(x.poem)}»</div>`:''}</td><td>${x.file_key?`<audio controls preload="none" src="/song/${x.id}/play"></audio>`:x.ext_url?`<a href="${esc(x.ext_url)}" target="_blank" rel="noopener">ссылка</a>`:'<span class="muted">нет</span>'}</td><td class="num">${x.plays}</td><td class="num">${x.downloads}</td><td>${x.published?'да':'<span class="muted">нет</span>'}</td><td><button class="btn small" data-se="${x.id}">Изменить</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Песен пока нет. Они появятся на сайте разделом «Песни» — с плеером, текстом и кнопкой «Скачать».</td></tr>'}</tbody></table></div>`;
  const ed=$('.editor');bindUploads(ed);
  $('#s-save').onclick=async()=>{try{await api('songs',{id:e.id,title:$('#s-title').value,poem:$('#s-poem').value,performer:$('#s-perf').value,music_by:$('#s-music').value,note:$('#s-note').value,lyrics:$('#s-lyr').value,ext_url:$('#s-ext').value,sort:$('#s-sort').value,published:$('#s-pub').checked,
    file_key:upVal(ed,'song','key'),file_name:upVal(ed,'song','name'),file_size:upVal(ed,'song','size')});toast('Песня сохранена');songs()}catch(err){toast(err.message)}};
  if(e.id){$('#s-new').onclick=()=>songs();$('#s-del').onclick=async()=>{if(!confirm('Удалить песню вместе с файлом?'))return;await api('song-delete',{id:e.id});toast('Удалено');songs()}}
  document.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>songs(d.items.find(x=>x.id===Number(b.dataset.se))));
}

api('summary?days=1').then(start).catch(()=>{});
</script>
</body>
</html>
