name = "popkov-site"
main = "src/index.js"
account_id = "69baa910a30725f3c0ad38de1724cae9"
compatibility_date = "2024-11-01"

assets = { directory = "./assets", binding = "ASSETS", not_found_handling = "404-page", run_worker_first = true }

# шаблон главной страницы собирается сервером из базы (каталог, отрывки, песни)
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
SITE_URL = "https://popkov-site.a-perevedencev.workers.dev"
BOT_USERNAME = "PetyaVasechkinBot"

[[d1_databases]]
binding = "DB"
database_name = "popkov"
database_id = "d82802ab-70e3-4a04-a689-0ce688d7e272"

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "popkov-books"

# Секреты (wrangler secret put …): CRM_PASSWORD, SESSION_SECRET, TG_TOKEN, TG_WEBHOOK_SECRET
