name = "popkov-site"
main = "src/index.js"
compatibility_date = "2024-11-01"

assets = { directory = "./assets", binding = "ASSETS", not_found_handling = "404-page" }

[vars]
SITE_URL = "https://popkov-site.example.workers.dev"   # заменить на адрес после первого развёртывания
BOT_USERNAME = ""                                      # имя бота без @

[[d1_databases]]
binding = "DB"
database_name = "popkov"
database_id = "00000000-0000-0000-0000-000000000000"  # заполнит scripts/deploy

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "popkov-books"

# Секреты (wrangler secret put …): CRM_PASSWORD, SESSION_SECRET, TG_TOKEN, TG_WEBHOOK_SECRET
